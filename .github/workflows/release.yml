name: Verify and release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm run install:ci
      - run: node scripts/ensure-workerd-linux.mjs
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
  release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Check that this is still the latest main commit
        id: head
        shell: bash
        run: |
          git fetch origin main --tags
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo 'current=false' >> "$GITHUB_OUTPUT"
          elif git tag --points-at HEAD | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo "existing_tag=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)" >> "$GITHUB_OUTPUT"
          else
            echo 'current=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Select next version
        if: steps.head.outputs.current == 'true'
        id: version
        run: python3 scripts/release_version.py
      - name: Commit release metadata and tag
        if: steps.head.outputs.current == 'true'
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: release $RELEASE_TAG"
          fi
          git tag "$RELEASE_TAG"
          git push --atomic origin HEAD:main "$RELEASE_TAG"
      - name: Publish GitHub Release
        if: steps.head.outputs.current == 'true' || steps.head.outputs.existing_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag || steps.head.outputs.existing_tag }}
        run: gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "$RELEASE_TAG"
