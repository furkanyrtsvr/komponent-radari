name: Collect merchant price archive
on:
  schedule:
    - cron: '13,43 * * * *'
  workflow_dispatch:
    inputs:
      bootstrap:
        description: Start or resume the administrator-approved initial archive
        type: boolean
        default: false
      limit:
        description: Maximum pages per merchant in this batch
        default: '40'
        required: true
      recovery_set:
        description: Optional exact failed-page recovery set
        type: choice
        default: none
        options:
          - none
          - failed19-2026-10-24
          - max7219-2026-10-25
          - hobidevre-max7219-2026-10-25
permissions:
  contents: read
concurrency:
  group: merchant-price-archive
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm run install:ci
      - uses: actions/cache/restore@v4
        with:
          path: work/catalogue-b/catalogue.sqlite
          key: merchant-archive-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: merchant-archive-v2-
      - name: Continue the administrator's initial archive
        id: bootstrap
        env:
          CATALOG_INGEST_SECRET: ${{ secrets.CATALOG_INGEST_SECRET }}
          START_INITIAL_ARCHIVE: ${{ inputs.bootstrap && 'true' || 'false' }}
        run: node --import tsx scripts/catalog/run-bootstrap.ts
      - name: Collect a bounded batch and persist verified prices
        if: steps.bootstrap.outputs.active != 'true'
        env:
          CATALOG_INGEST_SECRET: ${{ secrets.CATALOG_INGEST_SECRET }}
          COLLECTION_LIMIT: ${{ inputs.limit || '40' }}
          RECOVERY_SET: ${{ inputs.recovery_set || 'none' }}
        run: |
          test -n "$CATALOG_INGEST_SECRET" || { echo 'Collector secret is missing'; exit 1; }
          RECOVERY_ARGS=()
          if [ "$RECOVERY_SET" = "failed19-2026-10-24" ]; then
            RECOVERY_ARGS=(--targets=scripts/catalog/recovery/failed19-2026-10-24.json)
          fi
          if [ "$RECOVERY_SET" = "max7219-2026-10-25" ]; then
            RECOVERY_ARGS=(--targets=scripts/catalog/recovery/max7219-2026-10-25.json)
          fi
          if [ "$RECOVERY_SET" = "hobidevre-max7219-2026-10-25" ]; then
            RECOVERY_ARGS=(--targets=scripts/catalog/recovery/hobidevre-max7219-2026-10-25.json)
          fi
          node --import tsx scripts/catalog/catalogue-b.ts --collect --limit="$COLLECTION_LIMIT" --site=https://komponent-radari.equalwood4.chatgpt.site "${RECOVERY_ARGS[@]}"
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: work/catalogue-b/catalogue.sqlite
          key: merchant-archive-v2-${{ github.run_id }}-${{ github.run_attempt }}
