name: Collect merchant price archive
on:
  schedule:
    - cron: '13,43 * * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum pages per merchant in this batch
        default: '40'
        required: true
permissions:
  contents: read
concurrency:
  group: merchant-price-archive
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm run install:ci
      - uses: actions/cache/restore@v4
        with:
          path: work/catalogue-b/catalogue.sqlite
          key: merchant-archive-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: merchant-archive-v2-
      - name: Collect a bounded batch and persist verified prices
        env:
          CATALOG_INGEST_SECRET: ${{ secrets.CATALOG_INGEST_SECRET }}
          COLLECTION_LIMIT: ${{ inputs.limit || '40' }}
        run: |
          test -n "$CATALOG_INGEST_SECRET" || { echo 'Collector secret is missing'; exit 1; }
          node --import tsx scripts/catalog/catalogue-b.ts --collect --limit="$COLLECTION_LIMIT" --site=https://komponent-radari.equalwood4.chatgpt.site
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: work/catalogue-b/catalogue.sqlite
          key: merchant-archive-v2-${{ github.run_id }}-${{ github.run_attempt }}
