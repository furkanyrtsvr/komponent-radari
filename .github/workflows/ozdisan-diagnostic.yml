name: Diagnose Ozdisan product evidence
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm run install:ci
      - run: node --import tsx scripts/catalog/diagnose-ozdisan.ts
      - run: node --import tsx scripts/catalog/audit-sales-units.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ozdisan-public-evidence
          path: |
            outputs/ozdisan-diagnostic/
            outputs/units-live/
          retention-days: 7
