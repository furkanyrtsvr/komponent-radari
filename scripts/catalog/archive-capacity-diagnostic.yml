name: Diagnose archive capacity
on: workflow_dispatch
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run install:ci
      - run: node --import tsx scripts/catalog/diagnose-capacity.ts
        env:
          CATALOG_INGEST_SECRET: ${{ secrets.CATALOG_INGEST_SECRET }}
